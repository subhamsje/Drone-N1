name: Altaria Flight Validation Campaign

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 0 * * *'

jobs:
  sitl-validation:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE20: 'true'

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install fastapi pydantic uvicorn numpy httpx websockets cryptography python-multipart

    - name: Run Scenario 1 - GPS Loss Recovery
      run: python validation/scenarios/sitl_gps_loss.py

    - name: Run Scenario 2 - Motor 3 Degradation Recovery
      run: python validation/scenarios/sitl_motor_failure.py

    - name: Run Scenario 3 - 25-Node Swarm Mesh Scale
      run: python validation/scenarios/swarm_scale_test.py

    - name: Run Master Empirical Validation Benchmark Suite
      run: python validation/run_all_validation_campaigns.py

    - name: Upload Certification Evidence Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: certification-evidence
        path: validation/reports/*.json