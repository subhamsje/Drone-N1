version: '3.8'

services:
  # 1. Sovereign Cognitive Kernel & FastAPI Gateway
  altaria-backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: altaria-kernel-backend
    ports:
      - "8080:8080"
    environment:
      - PYTHONPATH=.
      - ENVIRONMENT=production
      - CLICKHOUSE_HOST=clickhouse
    depends_on:
      - clickhouse
    restart: always

  # 2. Planetary Command Surface UI (Vite / Nginx)
  altaria-frontend:
    build:
      context: ./frontend/apps/command
      dockerfile: Dockerfile
    container_name: altaria-command-surface
    ports:
      - "5173:80"
    depends_on:
      - altaria-backend
    restart: always

  # 3. ClickHouse Telemetry Lakehouse
  clickhouse:
    image: clickhouse/clickhouse-server:latest
    container_name: altaria-telemetry-lakehouse
    ports:
      - "8123:8123"
      - "9000:9000"
    volumes:
      - clickhouse-data:/var/lib/clickhouse
    restart: always

  # 4. PX4 Gazebo Headless SITL Simulator
  px4-sitl:
    image: jonasvautherin/px4-gazebo-headless:1.13.2
    container_name: altaria-px4-sitl
    ports:
      - "14540:14540/udp"
    restart: always

volumes:
  clickhouse-data:
